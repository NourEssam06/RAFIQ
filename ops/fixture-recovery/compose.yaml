    image: ${RAFIQ_RECOVERY_IMAGE_PROJECT:-rafiq-fixture}-web
    pull_policy: never

  worker:
    image: ${RAFIQ_RECOVERY_IMAGE_PROJECT:-rafiq-fixture}-worker
    pull_policy: never
