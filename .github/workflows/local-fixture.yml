name: Local fixture smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: fixture-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_ENV_FILES: .env.fixture.example
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Restore browser tooling and typecheck
        working-directory: web
        run: |
          npm install --global npm@11.19.1
          npm ci
          npm run typecheck
          npm exec -- playwright install --with-deps chromium
      - name: Validate configuration and ignored local files
        run: |
          docker compose config --quiet
          for file in .env .env.fixture server/.env.local web/debug.log logs/fixture.txt; do
            git check-ignore "$file"
          done
          git ls-files --error-unmatch .env.fixture.example
      - name: Build and boot with an empty PostgreSQL volume
        run: |
          docker version
          docker compose version
          docker compose up --build --wait --wait-timeout 180
          docker compose ps -a
          migration="$(docker compose ps -a -q migrate)"
          test "$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$migration")" = 'exited 0'
          curl --fail --silent --show-error http://127.0.0.1:3000/healthz
          curl --fail --silent --show-error http://127.0.0.1:8000/internal/livez
          curl --fail --silent --show-error http://127.0.0.1:8000/internal/readyz
      - name: Record runtime and build artifacts
        run: |
          docker compose exec -T db postgres --version
          docker compose exec -T web node --version
          docker compose exec -T web npm --version
          docker compose exec -T api python --version
          docker compose exec -T api uv --version
          docker compose exec -T worker python --version
          docker compose exec -T worker uv --version
          docker compose exec -T worker Rscript --version
          docker compose exec -T worker Rscript --vanilla -e 'print(packageVersion("renv")); print(packageVersion("jsonlite"))'
          docker compose images
          sha256sum web/package-lock.json server/uv.lock server/renv.lock
      - name: Verify browser submission, reload and identity denial
        working-directory: web
        run: npm run test:e2e
      - name: Verify R output, runtime grants and lease fencing
        run: |
          docker compose stop worker
          docker compose run --rm --no-deps \
            -e RAFIQ_API_DATABASE_URL=postgresql+psycopg://rafiq_api:local-api-only@db:5432/rafiq \
            worker python -m unittest discover -s tests -v
      - name: Recreate containers and verify persisted result
        run: |
          docker compose down
          docker compose up --wait --wait-timeout 180
          curl --fail --silent --show-error \
            -H 'Authorization: Bearer local-driver-a' http://127.0.0.1:8000/api/v1/local-fixtures/current \
            | jq -e '.status == "completed" and .result == {"version":1,"method":"synthetic-mean-v1","count":3,"mean":4}'
      - name: Render and compare PDF and Word from the persisted fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fontconfig fonts-dejavu-core
          docker compose --profile render build renderer
          bash ops/fixture-render/smoke.sh
      - name: Upload synthetic render evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-render-fixture
          path: logs/render-fixture/
          if-no-files-found: error
          retention-days: 14
      - name: Stop the smoke stack before the recovery drill
        run: docker compose down
      - name: Verify populated upgrade, probes, drain, reclaim and browser recovery
        working-directory: web
        env:
          RAFIQ_RECOVERY_DRILL: '1'
          RAFIQ_RECOVERY_IMAGE_PROJECT: ${{ env.COMPOSE_PROJECT_NAME }}
        run: npm run test:e2e -- recovery.spec.ts
      - name: Show fixture logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove disposable fixture
        if: always()
        run: docker compose down --volumes
